<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MarfaOS 12</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; height: 100vh; overflow: hidden; color: #fff; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 10px; }

    #desktop { position: fixed; inset: 0; background: #1a1a2e; background-size: cover; background-position: center; z-index: 0; transition: background 0.6s ease; }
    #desktop-icons { position: absolute; top: 20px; left: 20px; right: 20px; bottom: 80px; display: flex; flex-direction: column; flex-wrap: wrap; gap: 14px; z-index: 2; pointer-events: none; align-content: flex-start; }
    .desktop-icon { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 80px; padding: 8px 4px; border-radius: 10px; cursor: pointer; pointer-events: auto; transition: background 0.15s; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.7); }
    .desktop-icon:hover { background: rgba(255,255,255,0.15); }
    .desktop-icon:active { transform: scale(0.96); }
    .desktop-icon .icon { font-size: 40px; line-height: 1.2; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5)); }
    .desktop-icon .label { font-size: 12px; text-align: center; margin-top: 4px; line-height: 1.3; max-width: 72px; word-wrap: break-word; background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 6px; backdrop-filter: blur(4px); }

    .website-shortcut .icon-box { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,0.45); margin-bottom: 2px; text-transform: uppercase; letter-spacing: -0.5px; border: 1px solid rgba(255,255,255,0.15); }
    .website-shortcut .label { background: rgba(0,0,0,0.5); }

    #desktop-context { display: none; position: fixed; background: rgba(40,40,60,0.95); backdrop-filter: blur(20px); border-radius: 12px; padding: 6px 0; min-width: 220px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.08); z-index: 9999; }
    #desktop-context .item { padding: 8px 20px; cursor: pointer; font-size: 13px; color: #e8e8f0; transition: background 0.1s; display: flex; align-items: center; gap: 12px; }
    #desktop-context .item:hover { background: rgba(255,255,255,0.1); }
    #desktop-context .item .icon { font-size: 16px; width: 24px; text-align: center; }
    #desktop-context .sep { height: 1px; background: rgba(255,255,255,0.08); margin: 4px 12px; }

    #taskbar { position: fixed; bottom: 0; left: 0; width: 100%; height: 54px; background: rgba(30,30,50,0.8); backdrop-filter: blur(24px) saturate(1.4); border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; padding: 0 12px; z-index: 999; gap: 4px; }
    #taskbar.left { flex-direction: column; width: 54px; height: 100%; bottom: 0; left: 0; top: 0; padding: 8px 4px; border-top: none; border-right: 1px solid rgba(255,255,255,0.08); }
    #taskbar.left .tb-center { flex-direction: column; flex: 1; width: 100%; gap: 4px; }
    #taskbar.left .tb-right { flex-direction: column; gap: 8px; }
    #taskbar.left .tb-left { flex-direction: column; }
    #taskbar.left .taskbar-item { width: 100%; justify-content: center; }
    #taskbar.left .taskbar-item .label { display: none; }
    #taskbar.top { bottom: auto; top: 0; border-top: none; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .tb-left, .tb-center, .tb-right { display: flex; align-items: center; gap: 4px; height: 100%; }
    .tb-center { flex: 1; justify-content: center; gap: 2px; overflow-x: auto; padding: 0 8px; }
    .tb-right { gap: 8px; font-size: 13px; color: #ddd; white-space: nowrap; padding-right: 4px; }
    #taskbar .taskbar-item { display: flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 8px; cursor: pointer; transition: all 0.15s; height: 38px; min-width: 40px; justify-content: center; background: transparent; border: none; color: #ddd; font-size: 13px; }
    #taskbar .taskbar-item:hover { background: rgba(255,255,255,0.1); }
    #taskbar .taskbar-item.active { background: rgba(255,255,255,0.15); }
    #taskbar .taskbar-item .icon { font-size: 18px; }
    #taskbar .taskbar-item .label { font-size: 12px; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #start-btn { font-size: 22px; padding: 4px 10px; border-radius: 10px; cursor: pointer; transition: background 0.15s; background: transparent; border: none; color: #ddd; }
    #start-btn:hover { background: rgba(255,255,255,0.12); }
    #clock { font-variant-numeric: tabular-nums; font-weight: 500; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; font-size: 12px; padding: 2px 8px; border-radius: 6px; }
    #clock .time { font-size: 14px; font-weight: 600; }
    #clock .date { font-size: 11px; opacity: 0.7; }

    #start-menu { display: none; position: fixed; bottom: 62px; left: 8px; width: 600px; max-height: 70vh; background: rgba(40,40,60,0.95); backdrop-filter: blur(40px) saturate(1.6); border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 30px 80px rgba(0,0,0,0.6); z-index: 9998; padding: 16px 20px 20px; flex-direction: column; }
    #start-menu.open { display: flex; }
    #start-menu .search-box { display: flex; align-items: center; background: rgba(255,255,255,0.08); border-radius: 10px; padding: 6px 14px; gap: 10px; margin-bottom: 14px; }
    #start-menu .search-box input { background: transparent; border: none; outline: none; color: #fff; font-size: 14px; width: 100%; }
    #start-menu .search-box input::placeholder { color: rgba(255,255,255,0.4); }
    #start-menu .sm-body { display: flex; gap: 20px; flex: 1; overflow: hidden; }
    #start-menu .sm-left { flex: 1; overflow-y: auto; padding-right: 6px; }
    #start-menu .sm-left .app-item { display: flex; align-items: center; gap: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    #start-menu .sm-left .app-item:hover { background: rgba(255,255,255,0.08); }
    #start-menu .sm-left .app-item .icon { font-size: 18px; width: 28px; text-align: center; }
    #start-menu .sm-right { width: 200px; border-left: 1px solid rgba(255,255,255,0.06); padding-left: 16px; overflow-y: auto; }
    #start-menu .sm-right .pinned-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.5; margin-bottom: 8px; font-weight: 600; }
    #start-menu .sm-right .pinned-item { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    #start-menu .sm-right .pinned-item:hover { background: rgba(255,255,255,0.08); }
    #start-menu .sm-right .pinned-item .icon { font-size: 18px; width: 26px; text-align: center; }
    #start-menu .sm-footer { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: flex-end; gap: 12px; font-size: 12px; color: rgba(255,255,255,0.5); }

    .window { position: fixed; min-width: 320px; min-height: 200px; background: rgba(45,45,65,0.92); backdrop-filter: blur(30px) saturate(1.4); border-radius: 14px; border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 20px 60px rgba(0,0,0,0.5); display: none; flex-direction: column; z-index: 100; overflow: hidden; }
    .window.open { display: flex; }
    .window.minimized { display: none !important; }
    .window.maximized { border-radius: 0 !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; bottom: 54px !important; }
    .window .win-header { display: flex; align-items: center; padding: 8px 12px; gap: 8px; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.04); cursor: grab; flex-shrink: 0; min-height: 40px; }
    .window .win-header:active { cursor: grabbing; }
    .window .win-header .win-icon { font-size: 16px; opacity: 0.7; }
    .window .win-header .win-title { flex: 1; font-size: 13px; font-weight: 500; color: #e8e8f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .window .win-header .win-controls { display: flex; gap: 6px; align-items: center; }
    .window .win-header .win-controls button { width: 28px; height: 28px; border: none; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: transparent; color: #ccc; line-height: 1; }
    .window .win-header .win-controls button:hover { background: rgba(255,255,255,0.1); }
    .window .win-header .win-controls .close-btn:hover { background: #ff3b30; color: #fff; }
    .window .win-body { flex: 1; padding: 12px 16px; overflow: auto; color: #e0e0e8; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; }
    .window .win-body::-webkit-scrollbar { width: 4px; }
    .window .win-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

    .explorer-sidebar { display: flex; gap: 12px; height: 100%; flex: 1; min-height: 0; }
    .explorer-sidebar .sidebar { width: 180px; background: rgba(255,255,255,0.03); border-radius: 8px; padding: 8px 4px; flex-shrink: 0; overflow-y: auto; }
    .explorer-sidebar .sidebar .item { padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 10px; }
    .explorer-sidebar .sidebar .item:hover { background: rgba(255,255,255,0.06); }
    .explorer-sidebar .main { flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    .explorer-sidebar .main .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .explorer-sidebar .main .toolbar button { padding: 4px 14px; border: none; border-radius: 6px; background: rgba(255,255,255,0.08); color: #ddd; cursor: pointer; font-size: 12px; }
    .explorer-sidebar .main .toolbar button:hover { background: rgba(255,255,255,0.15); }
    .explorer-sidebar .main .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; flex: 1; align-content: start; padding: 4px; overflow-y: auto; }
    .explorer-sidebar .main .file-grid .file-item { display: flex; flex-direction: column; align-items: center; padding: 8px 4px; border-radius: 8px; cursor: pointer; font-size: 12px; text-align: center; gap: 4px; }
    .explorer-sidebar .main .file-grid .file-item:hover { background: rgba(255,255,255,0.06); }
    .explorer-sidebar .main .file-grid .file-item .icon { font-size: 32px; }
    .explorer-sidebar .main .file-grid .file-item .name { font-size: 11px; word-wrap: break-word; max-width: 70px; line-height: 1.2; }

    .explorer-sidebar .main .search-bar { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 4px 10px; transition: border-color 0.15s; }
    .explorer-sidebar .main .search-bar:focus-within { border-color: #007aff; background: rgba(0,122,255,0.06); }
    .explorer-sidebar .main .search-bar input[type="text"] { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 13px; padding: 5px 0; }
    .explorer-sidebar .main .search-bar input[type="text"]::placeholder { color: rgba(255,255,255,0.35); }
    .explorer-sidebar .main .search-bar .search-clear { display: none; width: 20px; height: 20px; border: none; border-radius: 50%; background: rgba(255,255,255,0.1); color: #ccc; cursor: pointer; font-size: 11px; align-items: center; justify-content: center; padding: 0; line-height: 1; }
    .explorer-sidebar .main .search-bar .search-clear:hover { background: rgba(255,59,48,0.6); color: #fff; }
    .explorer-sidebar .main .search-bar .search-recursive { display: flex; align-items: center; gap: 4px; font-size: 11px; opacity: 0.7; cursor: pointer; user-select: none; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
    .explorer-sidebar .main .search-bar .search-recursive:hover { opacity: 1; background: rgba(255,255,255,0.05); }
    .explorer-sidebar .main .search-bar .search-recursive input { cursor: pointer; accent-color: #007aff; }
    .explorer-sidebar .main .search-status { font-size: 11px; padding: 4px 8px; border-radius: 6px; background: rgba(0,122,255,0.1); border: 1px solid rgba(0,122,255,0.2); color: #5ac8fa; margin: 4px 0; }
    .explorer-sidebar .main .search-status b { color: #fff; }
    .file-item .file-path { font-size: 9px; opacity: 0.45; max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
    .file-item mark.hl { background: rgba(255,204,0,0.4); color: #ffcc00; border-radius: 3px; padding: 0 2px; font-weight: 600; }

    .cp-tabs { display: flex; gap: 4px; border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 16px; padding-bottom: 4px; flex-wrap: wrap; }
    .cp-tabs .tab { padding: 6px 16px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 13px; background: transparent; border: none; color: rgba(255,255,255,0.6); }
    .cp-tabs .tab:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .cp-tabs .tab.active { background: rgba(255,255,255,0.08); color: #fff; font-weight: 500; }
    .cp-content .cp-pane { display: none; }
    .cp-content .cp-pane.active { display: block; }
    .cp-pane .setting-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); align-items: center; }
    .cp-pane .setting-row .label { font-size: 13px; opacity: 0.8; }
    .cp-pane .pc-info { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 20px; margin-top: 8px; font-size: 13px; }
    .cp-pane .pc-info .info-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .cp-pane .pc-info .info-item .key { opacity: 0.6; }
    .cp-pane .pc-info .info-item .val { font-weight: 500; }
    .cp-pane .storage-bar { display: flex; height: 8px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; margin: 8px 0 12px; }
    .cp-pane .storage-bar .fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, #007aff, #5ac8fa); }
    .cp-pane .disk-item { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.03); }

    .perso-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .perso-grid .card { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 12px 16px; }
    .perso-grid .card .title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.5; margin-bottom: 8px; font-weight: 600; }
    .perso-grid .card .option-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .perso-grid .card .option-group .opt { padding: 4px 14px; border-radius: 6px; background: rgba(255,255,255,0.06); cursor: pointer; font-size: 12px; border: 1px solid transparent; }
    .perso-grid .card .option-group .opt:hover { background: rgba(255,255,255,0.12); }
    .perso-grid .card .option-group .opt.active { background: rgba(0,122,255,0.3); border-color: #007aff; }
    .perso-grid .card .color-palette { display: flex; gap: 6px; flex-wrap: wrap; }
    .perso-grid .card .color-palette .c { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .perso-grid .card .color-palette .c:hover { transform: scale(1.1); }
    .perso-grid .card .color-palette .c.active { border-color: #fff; box-shadow: 0 0 0 2px #007aff; }
    .perso-grid .card .wallpaper-opt { display: flex; gap: 8px; flex-wrap: wrap; }
    .perso-grid .card .wallpaper-opt .wp { width: 80px; height: 50px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
    .perso-grid .card .wallpaper-opt .wp.active { border-color: #fff; box-shadow: 0 0 0 2px #007aff; }
    .perso-grid .card .url-input-group { display: flex; gap: 6px; margin-top: 6px; }
    .perso-grid .card .url-input-group input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 4px 10px; color: #ddd; font-size: 12px; outline: none; }
    .perso-grid .card .url-input-group button { padding: 4px 14px; border: none; border-radius: 6px; background: #007aff; color: #fff; cursor: pointer; font-size: 12px; }

    .btn { padding: 8px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.15s; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: #007aff; color: #fff; }
    .btn-primary:hover { background: #0055b3; }
    .btn-secondary { background: rgba(255,255,255,0.08); color: #ddd; }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }
    .btn-success { background: #34c759; color: #fff; }
    .btn-success:hover { background: #2a9d47; }
    .btn-danger { background: rgba(255,59,48,0.85); color: #fff; }
    .btn-danger:hover { background: #ff3b30; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

    .app-calc .display { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 12px 16px; text-align: right; margin-bottom: 12px; min-height: 60px; display: flex; align-items: flex-end; justify-content: flex-end; flex-direction: column; }
    .app-calc .display .expr { font-size: 14px; opacity: 0.5; }
    .app-calc .display .result { font-size: 32px; font-weight: 400; }
    .app-calc .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .app-calc .grid button { padding: 12px 0; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; background: rgba(255,255,255,0.06); color: #e8e8f0; }
    .app-calc .grid button:hover { background: rgba(255,255,255,0.14); }
    .app-calc .grid button.op { background: rgba(0,122,255,0.25); color: #5ac8fa; }
    .app-calc .grid button.eq { background: #007aff; color: #fff; }

    .app-notepad { display: flex; flex-direction: column; height: 100%; }
    .app-notepad .np-toolbar { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .app-notepad .np-toolbar button { padding: 5px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; background: rgba(255,255,255,0.08); color: #ddd; }
    .app-notepad .np-toolbar button:hover { background: rgba(255,255,255,0.15); }
    .app-notepad .np-toolbar button.save { background: rgba(0,122,255,0.3); color: #5ac8fa; }
    .app-notepad .np-toolbar button.save:hover { background: rgba(0,122,255,0.45); }
    .app-notepad .np-filename { margin-left: auto; font-size: 12px; opacity: 0.5; }
    .app-notepad textarea { flex: 1; width: 100%; min-height: 200px; background: rgba(0,0,0,0.2); border: none; border-radius: 8px; color: #e8e8f0; padding: 10px 12px; font-size: 14px; font-family: 'Consolas', 'Courier New', monospace; resize: none; outline: none; line-height: 1.5; }
    .app-notepad .stats { display: flex; gap: 16px; font-size: 12px; opacity: 0.5; margin-top: 6px; flex-wrap: wrap; }

    .app-media { display: flex; flex-direction: column; height: 100%; }
    .app-media .upload-area { border: 2px dashed rgba(255,255,255,0.15); border-radius: 12px; padding: 24px 20px; text-align: center; cursor: pointer; margin-bottom: 12px; }
    .app-media .upload-area:hover { border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.03); }
    .app-media .upload-area .icon { font-size: 36px; opacity: 0.5; }
    .app-media .mp-filename { font-size: 13px; opacity: 0.7; margin-bottom: 6px; word-break: break-all; }
    .app-media .mp-meta { font-size: 11px; opacity: 0.5; margin-bottom: 8px; }
    .app-media video, .app-media audio, .app-media img { width: 100%; border-radius: 8px; max-height: 380px; object-fit: contain; background: #000; }
    .app-media .mp-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .app-media .mp-actions button, .app-media .mp-actions a { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; background: rgba(255,255,255,0.08); color: #ddd; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .app-media .mp-actions .primary { background: rgba(0,122,255,0.3); color: #5ac8fa; }
    .app-media .mp-error { margin-top: 10px; padding: 10px 14px; border-radius: 8px; background: rgba(255,59,48,0.12); border: 1px solid rgba(255,59,48,0.3); color: #ff8a80; font-size: 12px; line-height: 1.5; }
    .app-media .mp-error b { color: #ff6b6b; }

    .app-paint canvas { border-radius: 8px; background: #fff; cursor: crosshair; width: 100%; height: 300px; touch-action: none; }
    .app-paint .tools { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .app-paint .tools button { padding: 4px 14px; border: none; border-radius: 6px; background: rgba(255,255,255,0.08); color: #ddd; cursor: pointer; font-size: 12px; }
    .app-paint .tools input[type="color"] { width: 32px; height: 32px; border: none; border-radius: 6px; cursor: pointer; background: transparent; }

    .app-cmd .cmd-output { background: rgba(0,0,0,0.4); border-radius: 8px; padding: 10px 14px; font-family: 'Consolas', monospace; font-size: 13px; min-height: 120px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; color: #8be9fd; margin-bottom: 6px; }
    .app-cmd .cmd-input { display: flex; gap: 6px; }
    .app-cmd .cmd-input input { flex: 1; background: rgba(0,0,0,0.3); border: none; border-radius: 6px; padding: 6px 12px; color: #e8e8f0; font-family: 'Consolas', monospace; font-size: 13px; outline: none; }
    .app-cmd .cmd-input button { padding: 6px 16px; border: none; border-radius: 6px; background: rgba(255,255,255,0.08); color: #ddd; cursor: pointer; font-size: 13px; }

        ]

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultState();
        const saved = JSON.parse(raw);
        const def = getDefaultState();
        return {
            language: saved.language || 'en',
            fileSystem: saved.fileSystem || def.fileSystem,
            pinnedApps: saved.pinnedApps || def.pinnedApps,
            wallpaper: saved.wallpaper || def.wallpaper,
            wallpaperUrl: saved.wallpaperUrl || null,
            accentColor: saved.accentColor || def.accentColor,
            taskbarPosition: saved.taskbarPosition || 'bottom',
            websiteShortcuts: saved.websiteShortcuts || def.websiteShortcuts
        };
    } catch (e) { return getDefaultState(); }
}

let saveTimeout = null;
function saveState() {
    if (saveTimeout) clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                language: state.language,
                fileSystem: state.fileSystem,
                pinnedApps: state.pinnedApps,
                wallpaper: state.wallpaper,
                wallpaperUrl: state.wallpaperUrl,
                accentColor: state.accentColor,
                taskbarPosition: state.taskbarPosition,
                websiteShortcuts: state.websiteShortcuts
            }));
        } catch (e) {}
    }, 200);
}

function getFileSystemNode(pathArray) {
    if (!pathArray || !pathArray.length) return null;
    let node = state.fileSystem[pathArray[0]];
    if (!node) return null;
    for (let i = 1; i < pathArray.length; i++) {
        const seg = pathArray[i];
        if (node && node.children && node.children[seg]) node = node.children[seg];
        else return null;
    }
    return node;
}
function getParentPath(p) { return p.slice(0, -1); }
function getFileExtension(name) { const i = name.lastIndexOf('.'); return i > 0 ? name.slice(i+1).toLowerCase() : ''; }

const TEXT_EXTS = ['txt','md','json','js','html','css','xml','log','ini','cfg','conf','yml','yaml','csv'];
const IMAGE_EXTS = ['png','jpg','jpeg','gif','svg','webp','bmp','ico','avif'];
const AUDIO_EXTS = ['mp3','wav','ogg','oga','flac','aac','m4a','opus','weba'];
const VIDEO_EXTS = ['mp4','webm','mkv','m4v','ogv','avi','mov','wmv','flv','3gp','ts','m2ts','mpg','mpeg'];

function getFileIcon(name, isFolder) {
    if (isFolder) return '📁';
    const ext = getFileExtension(name);
    if (VIDEO_EXTS.includes(ext)) return '🎬';
    if (AUDIO_EXTS.includes(ext)) return '🎵';
    if (IMAGE_EXTS.includes(ext)) return '🖼️';
    const map = { txt:'📄', js:'📜', html:'🌐', css:'🎨', json:'📋', md:'📝', exe:'⚙️', zip:'📦', rar:'📦', pdf:'📕', iso:'💿' };
    return map[ext] || '📄';
}
function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
    if (bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(1) + ' MB';
    return (bytes/1024/1024/1024).toFixed(2) + ' GB';
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]); }
function highlightMatch(text, query) {
    const safe = escapeHtml(text);
    if (!query) return safe;
    const q = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return safe.replace(new RegExp('(' + q + ')', 'gi'), '<mark class="hl">$1</mark>');
}
function declOfNum(n, forms) {
    n = Math.abs(n) % 100;
    const n1 = n % 10;
    if (n > 10 && n < 20) return forms[2];
    if (n1 > 1 && n1 < 5) return forms[1];
    if (n1 === 1) return forms[0];
    return forms[2];
}

const AUDIO_MIMES = { mp3:'audio/mpeg', wav:'audio/wav', ogg:'audio/ogg', oga:'audio/ogg', flac:'audio/flac', aac:'audio/aac', m4a:'audio/mp4', opus:'audio/opus', weba:'audio/webm' };

const sound = {
    enabled: true, ctx: null,
    init() { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} },
    play(type) {
        if (!this.enabled || !this.ctx) return;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain); gain.connect(this.ctx.destination);
            gain.gain.value = 0.05;
            const t = this.ctx.currentTime;
            const freqs = { startup: [523, 784, 0.4], click: [800, 0, 0.04], notification: [880, 1108, 0.15] };
            const [f1, f2, dur] = freqs[type] || [800, 0, 0.04];
            osc.frequency.setValueAtTime(f1, t);
            if (f2) osc.frequency.setValueAtTime(f2, t + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
            osc.start(t); osc.stop(t + dur);
        } catch(e){}
    }
};
sound.init();

function showDialog(title, msg, actions) {
    return new Promise((resolve) => {
        const overlay = document.getElementById('dialog-overlay');
        document.getElementById('dialog-title').textContent = title;
        document.getElementById('dialog-msg').textContent = msg;
        const container = document.getElementById('dialog-actions');
        container.innerHTML = '';
        (actions || [{label: t('ok'), value: true, class: 'primary'}]).forEach(a => {
            const btn = document.createElement('button');
            btn.textContent = a.label;
            if (a.class) btn.className = a.class;
            btn.onclick = () => {
                overlay.classList.remove('open');
                sound.play('click');
                resolve(a.value);
            };
            container.appendChild(btn);
        });
        overlay.classList.add('open');
    });
}
function showAlert(t1, m) { return showDialog(t1, m, [{label: t('ok'), value: true, class: 'primary'}]); }
function showConfirm(t1, m) { return showDialog(t1, m, [{label: t('cancel'), value: false}, {label: t('ok'), value: true, class: 'primary'}]); }

function createWindow(appId, title, icon, contentFn, width, height, params) {
    width = width || 560; height = height || 420;
    const id = 'win_' + (state.nextWindowId++);
    const win = document.createElement('div');
    win.className = 'window';
    win.id = id;
    win.style.width = width + 'px';
    win.style.height = height + 'px';
    win.style.left = (80 + Math.random() * 60) + 'px';
    win.style.top = (60 + Math.random() * 40) + 'px';

    const header = document.createElement('div');
    header.className = 'win-header';
    header.innerHTML = `<span class="win-icon">${icon}</span><span class="win-title">${escapeHtml(title)}</span>
        <div class="win-controls"><button class="min-btn">─</button><button class="max-btn">⬜</button><button class="close-btn">✕</button></div>`;
    win.appendChild(header);

    const body = document.createElement('div');
    body.className = 'win-body';
    body.id = id + '_body';
    win.appendChild(body);
    document.body.appendChild(win);

    let isDragging = false, dragStartX, dragStartY, winStartX, winStartY;

    header.querySelector('.min-btn').onclick = (e) => { e.stopPropagation(); minimizeWindow(id); };
    header.querySelector('.max-btn').onclick = (e) => { e.stopPropagation(); toggleMaximize(id); };
    header.querySelector('.close-btn').onclick = (e) => { e.stopPropagation(); closeWindow(id); };

    header.addEventListener('mousedown', (e) => {
        if (e.target.closest('.win-controls')) return;
        if (state.windows[id] && state.windows[id].isMaximized) return;
        isDragging = true;
        dragStartX = e.clientX; dragStartY = e.clientY;
        winStartX = win.offsetLeft; winStartY = win.offsetTop;
        bringToFront(id);
        document.body.style.cursor = 'grabbing';
    });
    const onMove = (e) => {
        if (isDragging) {
            win.style.left = Math.max(0, winStartX + e.clientX - dragStartX) + 'px';
            win.style.top = Math.max(0, winStartY + e.clientY - dragStartY) + 'px';
        }
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', () => { isDragging = false; document.body.style.cursor = ''; });

    state.windows[id] = { id, appId, title, icon, element: win, body, params: params || {},
        isMinimized: false, isMaximized: false, isOpen: true, zIndex: 100 };

    if (contentFn) {
        try { contentFn(body, id, params || {}); }
        catch(e) { body.innerHTML = '<div style="color:#ff6b6b;">Error: ' + e.message + '</div>'; }
    }

    win.style.display = 'flex';
    win.classList.add('open');
    bringToFront(id);
    updateTaskbar();
    return id;
}

function bringToFront(id) {
    const win = state.windows[id]; if (!win) return;
    const maxZ = Math.max(100, ...Object.values(state.windows).map(w => w.zIndex || 100));
    win.zIndex = maxZ + 1;
    win.element.style.zIndex = win.zIndex;
    state.activeWindowId = id;
    updateTaskbar();
}
function minimizeWindow(id) {
    const w = state.windows[id]; if (!w) return;
    w.isMinimized = true; w.element.classList.add('minimized');
    updateTaskbar(); sound.play('click');
}
function restoreWindow(id) {
    const w = state.windows[id]; if (!w) return;
    w.isMinimized = false; w.element.classList.remove('minimized');
    bringToFront(id); sound.play('click');
}
function toggleMaximize(id) {
    const w = state.windows[id]; if (!w) return;
    w.isMaximized = !w.isMaximized;
    w.element.classList.toggle('maximized', w.isMaximized);
    sound.play('click');
}
function closeWindow(id) {
    const w = state.windows[id]; if (!w) return;
    w.element.remove(); delete state.windows[id];
    updateTaskbar(); sound.play('click');
}
function getWindowByAppId(appId) {
    for (const w of Object.values(state.windows)) if (w.appId === appId && w.isOpen) return w;
    return null;
}
function openApp(appId, params) {
    const app = apps[appId]; if (!app) return;
    const forceNew = params && params.path;
    if (!forceNew) {
        const ex = getWindowByAppId(appId);
        if (ex) { if (ex.isMinimized) restoreWindow(ex.id); else bringToFront(ex.id); return; }
    }
    const title = (params && params.path) ? params.path[params.path.length - 1] : app.title;
    createWindow(appId, title, app.icon, app.render, app.width, app.height, params);
    sound.play('notification');
}
function updateTaskbar() {
    const c = document.getElementById('taskbar-windows');
    c.innerHTML = '';
    for (const win of Object.values(state.windows)) {
        if (!win.isOpen) continue;
        const btn = document.createElement('button');
        btn.className = 'taskbar-item';
        if (!win.isMinimized && state.activeWindowId === win.id) btn.classList.add('active');
        btn.innerHTML = `<span class="icon">${win.icon}</span><span class="label">${escapeHtml(win.title)}</span>`;
        btn.onclick = () => {
            if (win.isMinimized) restoreWindow(win.id);
            else if (state.activeWindowId === win.id) minimizeWindow(win.id);
            else bringToFront(win.id);
        };
        c.appendChild(btn);
    }
}
document.addEventListener('mousedown', (e) => {
    const el = e.target.closest('.window');
    if (el && state.windows[el.id]) bringToFront(el.id);
});

const apps = {};

function openFileByPath(pathArray) {
    const node = getFileSystemNode(pathArray);
    if (!node) return showAlert(t('error'), 'File not found');
    const name = pathArray[pathArray.length - 1];
    const ext = getFileExtension(name);
    if (TEXT_EXTS.includes(ext)) openApp('notepad', { path: pathArray });
    else if (IMAGE_EXTS.includes(ext) || AUDIO_EXTS.includes(ext) || VIDEO_EXTS.includes(ext)) openApp('mediaplayer', { path: pathArray });
}

        const grid = document.getElementById(winId + '_grid');

        const clearBtn = document.getElementById(winId + '_clear');
        const recCheck = document.getElementById(winId + '_rec');
        const statusEl = document.getElementById(winId + '_status');
        let searchQuery = '';

        function renderList() {
            let node = getFileSystemNode(state.currentPath);
            if (!node) { state.currentPath = ['X:', 'MarfaOS']; node = getFileSystemNode(state.currentPath); }
            pathEl.textContent = state.currentPath.join(' \\ ');

            sidebar.innerHTML = `
                <div class="item" data-nav="X:"><span>💾</span> ${t('disk_x')}</div>
                <div class="item" data-nav="X:,MarfaOS"><span>📁</span> ${t('marfaos')}</div>
                <div class="item" data-nav="X:,Desktop"><span>🖥️</span> ${t('desktop')}</div>
                <div class="item" data-nav="X:,Documents"><span>📄</span> ${t('documents')}</div>
                <div class="item" data-nav="X:,Downloads"><span>⬇️</span> ${t('downloads')}</div>`;
            sidebar.querySelectorAll('[data-nav]').forEach(el => {
                el.onclick = () => {
                    state.currentPath = el.dataset.nav.split(',');
                    searchInput.value = ''; searchQuery = '';
                    clearBtn.style.display = 'none'; statusEl.style.display = 'none';
                    renderList(); sound.play('click');
                };
            });

            grid.innerHTML = '';
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                const results = [];
                if (recCheck.checked) {
                    function rec(n, p) {
                        if (!n || !n.children) return;
                        for (const [name, item] of Object.entries(n.children)) {
                            if (name.toLowerCase().includes(q)) results.push({ name, item, path: [...p, name], nested: p.length > state.currentPath.length });
                            if (item.type === 'folder') rec(item, [...p, name]);
                        }
                    }
                    rec(getFileSystemNode([state.currentPath[0]]), [state.currentPath[0]]);
                } else {
                    for (const [name, item] of Object.entries(node.children || {})) {
                        if (name.toLowerCase().includes(q)) results.push({ name, item, path: [...state.currentPath, name], nested: false });
                    }
                }
                results.sort((a, b) => (a.item.type === 'folder' ? -1 : 1) - (b.item.type === 'folder' ? -1 : 1) || a.name.localeCompare(b.name));
                statusEl.style.display = 'block';
                if (results.length === 0) {
                    statusEl.innerHTML = `🔍 ${t('nothing_found')} <b>«${escapeHtml(searchQuery)}»</b>`;
                    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;opacity:0.4;padding:40px;">🔍 ${t('nothing_found')} «${escapeHtml(searchQuery)}»</div>`;
                    return;
                }
                statusEl.innerHTML = `🔍 ${t('found_label')}: <b>${results.length}</b> ${declOfNum(results.length, t('element'))} «${escapeHtml(searchQuery)}»${recCheck.checked ? ' <span style="opacity:0.6;">' + t('across_disk') + '</span>' : ''}`;
                results.forEach(({ name, item, path, nested }) => {
                    const isFolder = item.type === 'folder';
                    const el = document.createElement('div');
                    el.className = 'file-item';
                    el.innerHTML = `<span class="icon">${isFolder ? '📁' : getFileIcon(name)}</span><span class="name">${highlightMatch(name, searchQuery)}</span>${nested ? `<span class="file-path">${escapeHtml(path.slice(0, -1).join(' \\ '))}</span>` : ''}`;
                    el.oncontextmenu = (e) => { e.preventDefault(); e.stopPropagation(); showFileMenu(e.clientX, e.clientY, name, isFolder, path); };
                    el.ondblclick = () => {
                        if (isFolder) { state.currentPath = path; searchInput.value = ''; searchQuery = ''; clearBtn.style.display = 'none'; renderList(); }
                        else openFileByPath(path);
                        sound.play('click');
                    };
                    grid.appendChild(el);
                });
                return;
            }

            statusEl.style.display = 'none';
            const children = node.children || {};
            const keys = Object.keys(children).sort((a, b) => {
                if (children[a].type === 'folder' && children[b].type !== 'folder') return -1;
                if (children[a].type !== 'folder' && children[b].type === 'folder') return 1;
                return a.localeCompare(b);
            });
            if (keys.length === 0) grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;opacity:0.4;padding:40px;">${t('folder_empty')}</div>`;
            keys.forEach(name => {
                const item = children[name];
                const isFolder = item.type === 'folder';
                const el = document.createElement('div');
                el.className = 'file-item';
                el.innerHTML = `<span class="icon">${isFolder ? '📁' : getFileIcon(name)}</span><span class="name">${escapeHtml(name)}</span>`;
                el.oncontextmenu = (e) => { e.preventDefault(); e.stopPropagation(); showFileMenu(e.clientX, e.clientY, name, isFolder, [...state.currentPath, name]); };
                el.ondblclick = () => {
                    if (isFolder) { state.currentPath.push(name); renderList(); }
                    else openFileByPath([...state.currentPath, name]);
                    sound.play('click');
                };
                grid.appendChild(el);
            });
        }

        function showFileMenu(x, y, fileName, isFolder, filePath) {
            const menu = document.getElementById('desktop-context');
            menu.style.display = 'block';
            menu.style.left = x + 'px'; menu.style.top = y + 'px';
            menu.innerHTML = `
                <div class="item" data-cmd="new-folder"><span class="icon">📁</span> ${t('new_folder')}</div>
                <div class="item" data-cmd="new-file"><span class="icon">📄</span> ${t('file')}</div>
                ${fileName ? '<div class="sep"></div>' : ''}
                ${fileName ? `<div class="item" data-cmd="open"><span class="icon">📂</span> ${t('open')}</div>` : ''}
                ${fileName && filePath && filePath.length > 2 ? `<div class="item" data-cmd="show-in-folder"><span class="icon">📁</span> ${t('show_in_folder')}</div>` : ''}
                ${fileName ? `<div class="item" data-cmd="rename"><span class="icon">✏️</span> ${t('rename')}</div>` : ''}
                ${fileName ? `<div class="item" data-cmd="delete"><span class="icon">🗑️</span> ${t('delete')}</div>` : ''}
                ${fileName ? `<div class="item" data-cmd="copy"><span class="icon">📋</span> ${t('copy')}</div>` : ''}
                ${fileName ? `<div class="item" data-cmd="cut"><span class="icon">✂️</span> ${t('cut')}</div>` : ''}
                ${state.clipboard ? `<div class="item" data-cmd="paste"><span class="icon">📋</span> ${t('paste')}</div>` : ''}`;
            menu.querySelectorAll('[data-cmd]').forEach(el => {
                el.onclick = () => { menu.style.display = 'none'; handleCmd(el.dataset.cmd, fileName, isFolder, filePath); };
            });
            setTimeout(() => document.addEventListener('click', function c() { menu.style.display = 'none'; document.removeEventListener('click', c); }, { once: true }), 10);
        }

        function handleCmd(cmd, fileName, isFolder, filePath) {
            const workPath = (searchQuery && recCheck.checked && filePath) ? filePath.slice(0, -1) : state.currentPath;
            const node = getFileSystemNode(workPath);
            if (!node) return;
            if (!node.children) node.children = {};
            if (cmd === 'new-folder') {
                const name = prompt(t('new_folder') + ':');
                if (name && name.trim() && !node.children[name.trim()]) {
                    node.children[name.trim()] = { type: 'folder', label: name.trim(), children: {} };
                    saveState(); renderList(); renderDesktopIcons(); sound.play('click');
                }
            } else if (cmd === 'new-file') {
                const name = prompt(t('file') + ':');
                if (name && name.trim()) {
                    const fn = name.includes('.') ? name.trim() : name.trim() + '.txt';
                    if (!node.children[fn]) {
                        node.children[fn] = { type: 'file', label: fn, content: '' };
                        saveState(); renderList(); renderDesktopIcons(); sound.play('click');
                    }
                }
            } else if (cmd === 'open') {
                if (isFolder) { state.currentPath = filePath || [...state.currentPath, fileName]; searchInput.value = ''; searchQuery = ''; renderList(); }
                else openFileByPath(filePath || [...state.currentPath, fileName]);
            } else if (cmd === 'show-in-folder') {
                state.currentPath = filePath.slice(0, -1); searchInput.value = ''; searchQuery = ''; renderList();
            } else if (cmd === 'rename') {
                const nn = prompt(t('rename') + ':', fileName);
                if (nn && nn.trim() && nn.trim() !== fileName) {
                    const d = node.children[fileName]; delete node.children[fileName];
                    node.children[nn.trim()] = d;
                    saveState(); renderList(); renderDesktopIcons();
                }
            } else if (cmd === 'delete') {
                if (confirm(`${t('delete')} "${fileName}"?`)) {
                    delete node.children[fileName];
                    saveState(); renderList(); renderDesktopIcons();
                }
            } else if (cmd === 'copy') {
                state.clipboard = { source: [...workPath], name: fileName, data: node.children[fileName], cut: false };
            } else if (cmd === 'cut') {
                state.clipboard = { source: [...workPath], name: fileName, data: node.children[fileName], cut: true };
            } else if (cmd === 'paste' && state.clipboard) {
                const s = state.clipboard;
                if (!node.children[s.name]) {
                    node.children[s.name] = JSON.parse(JSON.stringify(s.data));
                    if (s.cut) { const p = getFileSystemNode(s.source); if (p && p.children) delete p.children[s.name]; }
                    state.clipboard = null;
                    saveState(); renderList(); renderDesktopIcons();
                }
            }
        }

        body.querySelectorAll('[data-act]').forEach(el => {
            el.onclick = () => {
                const act = el.dataset.act;
                if (act === 'up') { if (state.currentPath.length > 1) { state.currentPath = getParentPath(state.currentPath); searchInput.value = ''; searchQuery = ''; renderList(); } }
                else if (act === 'new-folder') handleCmd('new-folder');
                else if (act === 'new-file') handleCmd('new-file');
                else if (act === 'upload') document.getElementById('hidden-file-input').click();
                else if (act === 'refresh') { renderList(); renderDesktopIcons(); }
            };
        });

        searchInput.addEventListener('input', (e) => { searchQuery = e.target.value.trim(); clearBtn.style.display = searchQuery ? 'flex' : 'none'; renderList(); });
        clearBtn.onclick = () => { searchInput.value = ''; searchQuery = ''; clearBtn.style.display = 'none'; renderList(); searchInput.focus(); };
        recCheck.addEventListener('change', () => { if (searchQuery) renderList(); });
        grid.oncontextmenu = (e) => { e.preventDefault(); showFileMenu(e.clientX, e.clientY, null, false, null); };

        const fi = document.getElementById('hidden-file-input');
        fi.onchange = function() {
            const files = fi.files;
            if (!files.length) return;
            const node = getFileSystemNode(state.currentPath);
            if (!node) return;
            if (!node.children) node.children = {};
            let pending = files.length;
            for (const f of files) {
                if (node.children[f.name]) { pending--; continue; }
                const reader = new FileReader();
                reader.onload = (e) => {
                    node.children[f.name] = { type: 'file', label: f.name, content: e.target.result, size: f.size };
                    pending--;
                    if (pending === 0) { saveState(); renderList(); renderDesktopIcons(); }
                };
                reader.readAsDataURL(f);
            }
            fi.value = '';
        };
        renderList();
    }
};

apps.notepad = {
    get title() { return t('notepad'); },
    icon: '📝', width: 560, height: 440,
    render: function(body, winId, params) {
        let filePath = (params && params.path) ? [...params.path] : null;
        let initialContent = '';
        if (filePath) { const n = getFileSystemNode(filePath); if (n && n.content) initialContent = n.content; }
        const dispName = () => filePath ? filePath[filePath.length - 1] : t('untitled');
        body.className = 'app-notepad';
        body.innerHTML = `
            <div class="np-toolbar">
                <button class="save" id="np-save">💾 ${t('save')}</button>
                <button id="np-saveas">📁 ${t('save_as')}</button>
                <span class="np-filename" id="np-fname">${escapeHtml(dispName())}</span>
            </div>
            <textarea id="np-text" placeholder="${t('enter_text')}"></textarea>
            <div class="stats">
                <span>${t('characters')}: <b id="np-chars">0</b></span>
                <span>${t('lines')}: <b id="np-lines">0</b></span>
                <span>${t('words')}: <b id="np-words">0</b></span>
                <span>${t('reading_time')}: ~<b id="np-read">0</b> ${t('min')}</span>
            </div>`;
        const ta = document.getElementById('np-text');
        const fnameEl = document.getElementById('np-fname');
        ta.value = initialContent;
        function updateStats() {
            const v = ta.value;
            document.getElementById('np-chars').textContent = v.length;
            document.getElementById('np-lines').textContent = v.split('\n').length;
            const w = v.trim() ? v.trim().split(/\s+/).length : 0;
            document.getElementById('np-words').textContent = w;
            document.getElementById('np-read').textContent = Math.max(1, Math.round(w/200));
        }
        ta.addEventListener('input', updateStats);
        updateStats();
        function saveFile() {
            if (!filePath) return saveFileAs();
            const node = getFileSystemNode(filePath);
            if (!node) return saveFileAs();
            node.content = ta.value;
            saveState(); sound.play('notification');
            showAlert('💾 ' + t('saved'), t('file_saved') + ' "' + dispName() + '"');
            renderDesktopIcons();
        }
        function saveFileAs() {
            const dn = filePath ? filePath[filePath.length - 1] : t('new_file');
            const nn = prompt(t('save_as_prompt'), dn);
            if (!nn || !nn.trim()) return;
            const td = ['X:', 'Desktop'];
            const node = getFileSystemNode(td);
            if (!node) return;
            if (!node.children) node.children = {};
            const fn = nn.trim();
            if (node.children[fn] && (!filePath || filePath[filePath.length-1] !== fn)) {
                if (!confirm('"' + fn + '" ' + t('overwrite'))) return;
            }
            node.children[fn] = { type: 'file', label: fn, content: ta.value };
            filePath = [...td, fn];
            fnameEl.textContent = dispName();
            const win = state.windows[winId];
            if (win) { win.title = fn; win.element.querySelector('.win-title').textContent = fn; updateTaskbar(); }
            saveState(); renderDesktopIcons(); sound.play('notification');
            showAlert('💾 ' + t('saved'), '"' + fn + '" ' + t('saved_to_desktop'));
        }
        document.getElementById('np-save').onclick = saveFile;
        document.getElementById('np-saveas').onclick = saveFileAs;
        ta.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveFile(); } });
    }
};

// ---- MEDIA PLAYER ----
apps.mediaplayer = {
    get title() { return t('mediaplayer'); },
    icon: '🎵', width: 580, height: 520,
    render: function(body, winId, params) {
        body.className = 'app-media';
        body.innerHTML = `
            <div class="upload-area" id="mp-up">
                <div class="icon">🎬</div>
                <div style="margin-top:8px;opacity:0.6;">${t('click_or_drag')}<br><small>${t('media_hint')}</small></div>
            </div>
            <div id="mp-cont"></div>`;
        const up = document.getElementById('mp-up');
        const cont = document.getElementById('mp-cont');

        function renderContent(name, content, ext) {
            const isV = VIDEO_EXTS.includes(ext), isI = IMAGE_EXTS.includes(ext), isA = AUDIO_EXTS.includes(ext);
            cont.innerHTML = '';
            const info = document.createElement('div');
            info.className = 'mp-filename';
            info.textContent = '📄 ' + name;
            cont.appendChild(info);
            const meta = document.createElement('div');
            meta.className = 'mp-meta';
            meta.textContent = `${t('format')}: .${ext.toUpperCase()} | ${t('type')}: ${isV ? t('video') : isA ? t('audio') : isI ? t('image') : t('unknown')}`;
            cont.appendChild(meta);
            if (isV) {
                const v = document.createElement('video');
                v.controls = true; v.preload = 'metadata'; v.style.background = '#000';
                if (VIDEO_MIMES[ext]) { const s = document.createElement('source'); s.src = content; s.type = VIDEO_MIMES[ext]; v.appendChild(s); }
                else v.src = content;
                cont.appendChild(v);
                let err = false;
                const showErr = (m) => {
                    if (err) return; err = true;
                    const e = document.createElement('div');
                    e.className = 'mp-error';
                    e.innerHTML = `<b>⚠️ ${t('cant_play')} .${ext.toUpperCase()}</b><br>${m}`;
                    cont.appendChild(e);
                    const a = document.createElement('div'); a.className = 'mp-actions';
                    const dl = document.createElement('a'); dl.className = 'primary';
                    dl.innerHTML = t('download_file'); dl.href = content; dl.download = name;
                    a.appendChild(dl); cont.appendChild(a);
                };
                v.addEventListener('error', () => showErr('Codec not supported'));
                setTimeout(() => { if (v.readyState === 0 && !err) showErr(t('not_supported')); }, 2500);
            } else if (isA) {
                const a = document.createElement('audio'); a.controls = true; a.src = content; cont.appendChild(a);
            } else if (isI) {
                const i = document.createElement('img'); i.src = content; cont.appendChild(i);
            }
            const actions = document.createElement('div'); actions.className = 'mp-actions';
            const btn = document.createElement('button'); btn.textContent = t('open_another_file');
            btn.onclick = () => up.click(); actions.appendChild(btn);
            cont.appendChild(actions);
        }

        if (params && params.path) {
            const n = getFileSystemNode(params.path);
            if (n && n.content) {
                const name = params.path[params.path.length - 1];
                renderContent(name, n.content, getFileExtension(name));
            }
        }
        function load(file) {
            if (!file) return;
            const ext = file.name.split('.').pop().toLowerCase();
            if (!VIDEO_EXTS.includes(ext) && !AUDIO_EXTS.includes(ext) && !IMAGE_EXTS.includes(ext)) return;
            renderContent(file.name, URL.createObjectURL(file), ext);
            sound.play('click');
        }
        up.onclick = () => {
            const inp = document.createElement('input'); inp.type = 'file';
            inp.accept = 'audio/*,video/*,image/*';
            inp.onchange = e => load(e.target.files[0]); inp.click();
        };
        up.addEventListener('dragover', e => { e.preventDefault(); up.style.borderColor = '#007aff'; });
        up.addEventListener('dragleave', () => up.style.borderColor = 'rgba(255,255,255,0.15)');
        up.addEventListener('drop', e => { e.preventDefault(); up.style.borderColor = 'rgba(255,255,255,0.15)'; load(e.dataTransfer.files[0]); });
    }
};

apps.paint = {
    get title() { return t('paint'); },
    icon: '🎨', width: 560, height: 460,
    render: function(body) {
        body.className = 'app-paint';
        body.innerHTML = `
            <div class="tools">
                <button data-tool="clear">🗑️ ${t('clear')}</button>
                <button data-tool="screenshot">📷 ${t('screenshot')}</button>
                <input type="color" id="p-color" value="#000000" />
                <input type="range" id="p-size" min="1" max="20" value="3" style="width:80px;" />
            </div>
            <canvas id="p-canvas"></canvas>`;
        const canvas = document.getElementById('p-canvas');
        const ctx = canvas.getContext('2d');
        let draw = false, lx, ly, color = '#000000', size = 3;
        function resize() { canvas.width = canvas.clientWidth || 500; canvas.height = 300; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        setTimeout(resize, 50);
        function pos(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX || e.touches?.[0]?.clientX) - r.left, y: (e.clientY || e.touches?.[0]?.clientY) - r.top }; }
        canvas.addEventListener('mousedown', e => { draw = true; const p = pos(e); lx = p.x; ly = p.y; });
        canvas.addEventListener('mousemove', e => { if (!draw) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p.x, p.y); ctx.strokeStyle = color; ctx.lineWidth = size; ctx.lineCap = 'round'; ctx.stroke(); lx = p.x; ly = p.y; });
        canvas.addEventListener('mouseup', () => draw = false);
        canvas.addEventListener('mouseleave', () => draw = false);
        document.getElementById('p-color').oninput = e => color = e.target.value;
        document.getElementById('p-size').oninput = e => size = +e.target.value;
        body.querySelectorAll('[data-tool]').forEach(el => {
            el.onclick = () => {
                if (el.dataset.tool === 'clear') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
                else {
                    const flash = document.getElementById('screenshot-flash');
                    flash.classList.add('active'); setTimeout(() => flash.classList.remove('active'), 150);
                    const link = document.createElement('a');
                    link.download = 'screenshot_' + Date.now() + '.png';
                    link.href = canvas.toDataURL('image/png'); link.click();
                }
            };
        });
    }
};

apps.cmd = {
    get title() { return t('cmd'); },
    icon: '⌨️', width: 560, height: 400,
    render: function(body) {
        body.className = 'app-cmd';
        body.innerHTML = `
            <div class="cmd-output" id="cmd-out">${t('cmd_welcome')}\n${t('cmd_type_help')}\n</div>
            <div class="cmd-input">
                <span style="color:#8be9fd;font-family:monospace;">C:\\&gt;</span>
                <input type="text" id="cmd-in" autofocus />
                <button id="cmd-go">OK</button>
            </div>`;
        const out = document.getElementById('cmd-out');
        const inp = document.getElementById('cmd-in');
        const cmds = {
            help: () => 'help, echo, cls, time, date, ver, whoami, dir, mkdir, del, calc, notepad, paint',
            echo: a => a.join(' '),
            cls: () => { out.textContent = ''; return ''; },
            time: () => new Date().toTimeString(),
            date: () => new Date().toDateString(),
            ver: () => 'MarfaOS 12.0.22621',
            whoami: () => 'user@marfaos',
            dir: () => { const n = getFileSystemNode(state.currentPath); return Object.keys(n.children || {}).join('\n') || 'Empty'; },
            mkdir: a => { if (!a[0]) return 'Specify name'; const n = getFileSystemNode(state.currentPath); if (n.children[a[0]]) return 'Exists'; n.children[a[0]] = { type: 'folder', label: a[0], children: {} }; saveState(); renderDesktopIcons(); return 'Created'; },
            del: a => { if (!a[0]) return 'Specify name'; const n = getFileSystemNode(state.currentPath); if (!n.children[a[0]]) return 'Not found'; delete n.children[a[0]]; saveState(); renderDesktopIcons(); return 'Deleted'; },
            calc: () => { openApp('calculator'); return 'OK'; },
            notepad: () => { openApp('notepad'); return 'OK'; },
            paint: () => { openApp('paint'); return 'OK'; }
        };
        function run() {
            const line = inp.value.trim(); if (!line) return;
            const parts = line.split(/\s+/); const cmd = parts[0].toLowerCase(); const args = parts.slice(1);
            let res = '';
            try { res = cmds[cmd] ? (cmds[cmd](args) || '') : `'${cmd}' is not a command`; } catch(e) { res = 'Error: ' + e.message; }
            out.textContent += `\nC:\\> ${line}\n${res}\n`;
            out.scrollTop = out.scrollHeight;
            inp.value = ''; sound.play('click');
        }
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
        document.getElementById('cmd-go').onclick = run;
        setTimeout(() => inp.focus(), 100);
    }
};

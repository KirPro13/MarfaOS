        document.getElementById('acc').querySelectorAll('[data-c]').forEach(el => {
            el.onclick = () => {
                document.getElementById('acc').querySelectorAll('[data-c]').forEach(x => x.classList.remove('active'));
                el.classList.add('active');
                state.accentColor = el.dataset.c;
                saveState();
            };
        });
        document.getElementById('wp-list').querySelectorAll('[data-w]').forEach(el => {
            el.onclick = () => {
                document.getElementById('wp-list').querySelectorAll('[data-w]').forEach(x => x.classList.remove('active'));
                el.classList.add('active');
                state.wallpaper = el.dataset.w; state.wallpaperUrl = null;
                document.getElementById('wp-url').value = '';
                applyWallpaper(wallpapers[state.wallpaper]);
                saveState();
            };
        });
        document.getElementById('wp-apply').onclick = () => {
            const url = document.getElementById('wp-url').value.trim();
            if (url) {
                state.wallpaperUrl = url; state.wallpaper = 'custom';
                document.getElementById('wp-list').querySelectorAll('[data-w]').forEach(x => x.classList.remove('active'));
                applyWallpaper(`url("${url}")`);
                saveState();
            }
        };
        document.getElementById('add-shortcut-from-cp').onclick = async () => {
            const r = await openShortcutDialog(null);
            if (r) { state.websiteShortcuts.push(r); saveState(); renderDesktopIcons();
                showAlert(t('done'), `"${r.name}" ${t('added_to_desktop')}`); }
        };
        document.getElementById('export-full').onclick = exportFullBackup;
        document.getElementById('import-backup').onclick = importBackup;
        document.getElementById('export-shortcuts').onclick = exportShortcutsOnly;
        document.getElementById('export-files').onclick = exportFilesOnly;
        document.getElementById('reset-all').onclick = () => {
            if (!confirm(t('reset_all') + '?')) return;
            localStorage.removeItem(STORAGE_KEY);
            location.reload();
        };
    }
};

// ============================================================
//  EXPORT / IMPORT
// ============================================================
function downloadBlob(filename, content) {
    const blob = new Blob([content], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportFullBackup() {
    const backup = {
        _meta: { version: '1.0', os: 'MarfaOS 12', exportedAt: new Date().toISOString() },
        language: state.language,
        fileSystem: state.fileSystem, pinnedApps: state.pinnedApps,
        wallpaper: state.wallpaper, wallpaperUrl: state.wallpaperUrl,
        accentColor: state.accentColor, taskbarPosition: state.taskbarPosition,
        websiteShortcuts: state.websiteShortcuts
    };
    const fn = `marfaos-backup_${new Date().toISOString().slice(0,10)}.json`;
    downloadBlob(fn, JSON.stringify(backup, null, 2));
    sound.play('notification');
    showAlert(t('export_done'), t('export_saved'));
}
function exportShortcutsOnly() {
    const d = { _meta: { type: 'website-shortcuts', exportedAt: new Date().toISOString() }, websiteShortcuts: state.websiteShortcuts };
    downloadBlob(`marfaos-shortcuts_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(d, null, 2));
    sound.play('notification');
    showAlert(t('export_shortcuts_title'), `Count: ${state.websiteShortcuts.length}`);
}
function exportFilesOnly() {
    const d = { _meta: { type: 'file-system', exportedAt: new Date().toISOString() }, fileSystem: state.fileSystem };
    downloadBlob(`marfaos-files_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(d, null, 2));
    sound.play('notification');
    showAlert(t('export_files_title'), 'OK');
}
function importBackup() { document.getElementById('import-file-input').click(); }
function handleImportFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            if (data.websiteShortcuts && !data.fileSystem) {
                showConfirm(t('import_backup'), `Count: ${data.websiteShortcuts.length}. Replace?`).then(ok => {
                    if (ok) { state.websiteShortcuts = data.websiteShortcuts; saveState(); renderDesktopIcons(); }
                });
                return;
            }
            if (data.fileSystem) {
                showConfirm(t('import_backup'), 'Replace all data?').then(ok => {
                    if (ok) {
                        state.fileSystem = data.fileSystem;
                        state.language = data.language || state.language;
                        state.pinnedApps = data.pinnedApps || state.pinnedApps;
                        state.wallpaper = data.wallpaper || state.wallpaper;
                        state.wallpaperUrl = data.wallpaperUrl || null;
                        state.accentColor = data.accentColor || state.accentColor;
                        state.taskbarPosition = data.taskbarPosition || state.taskbarPosition;
                        state.websiteShortcuts = data.websiteShortcuts || state.websiteShortcuts;
                        saveState();
                        location.reload();
                    }
                });
            }
        } catch (err) { showAlert(t('import_error'), t('import_parse_error') + err.message); }
    };
    reader.readAsText(file);
}

// ============================================================
//  SHORTCUT DIALOG
// ============================================================
function openShortcutDialog(existing) {
    return new Promise((resolve) => {
        const overlay = document.getElementById('form-overlay');
        const bodyEl = document.getElementById('form-body');
        document.getElementById('form-title').textContent = existing ? t('edit_shortcut') : t('new_shortcut_title');
        document.getElementById('form-cancel').textContent = t('cancel');
        document.getElementById('form-save').textContent = t('save');

        const data = existing ? { ...existing } : {
            id: 'sc_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
            name: '', url: '', icon: '🌐', color: '#007aff'
        };

        bodyEl.innerHTML = `
            <div class="form-row"><label>${t('name')}</label>
                <input type="text" id="sc-name" placeholder="${t('name_placeholder')}" value="${escapeHtml(data.name)}" maxlength="40" /></div>
            <div class="form-row"><label>${t('url')}</label>
                <input type="text" id="sc-url" placeholder="${t('url_placeholder')}" value="${escapeHtml(data.url)}" /></div>
            <div class="form-row"><label>${t('icon_label')}</label>
                <div class="emoji-picker" id="sc-emoji">
                    ${PRESET_EMOJIS.map(e => `<button class="emoji-btn ${e===data.icon?'active':''}" data-emoji="${e}">${e}</button>`).join('')}
                </div></div>
            <div class="form-row"><label>${t('color_label')}</label>
                <div class="color-picker-row" id="sc-color">
                    ${PRESET_COLORS.map(c => `<div class="swatch ${c===data.color?'active':''}" data-color="${c}" style="background:${c};"></div>`).join('')}
                </div></div>
            <div class="form-row"><label>${t('preview')}</label>
                <div class="preview-box">
                    <div class="icon-box" id="sc-prev-icon" style="background:${data.color};">${data.icon}</div>
                    <div><div class="preview-name" id="sc-prev-name">${escapeHtml(data.name) || t('no_name')}</div>
                        <div class="preview-url" id="sc-prev-url">${escapeHtml(data.url) || t('url_not_set')}</div></div>
                </div></div>`;

        const updatePrev = () => {
            const i = document.getElementById('sc-prev-icon');
            i.textContent = data.icon; i.style.background = data.color;
            document.getElementById('sc-prev-name').textContent = data.name || t('no_name');
            document.getElementById('sc-prev-url').textContent = data.url || t('url_not_set');
        };
        bodyEl.querySelectorAll('[data-emoji]').forEach(b => {
            b.onclick = () => { bodyEl.querySelectorAll('[data-emoji]').forEach(x => x.classList.remove('active')); b.classList.add('active'); data.icon = b.dataset.emoji; updatePrev(); };
        });
        bodyEl.querySelectorAll('[data-color]').forEach(s => {
            s.onclick = () => { bodyEl.querySelectorAll('[data-color]').forEach(x => x.classList.remove('active')); s.classList.add('active'); data.color = s.dataset.color; updatePrev(); };
        });
        const nameI = document.getElementById('sc-name');
        const urlI = document.getElementById('sc-url');
        nameI.oninput = () => { data.name = nameI.value; updatePrev(); };
        urlI.oninput = () => { data.url = urlI.value; updatePrev(); };
        setTimeout(() => nameI.focus(), 50);

        document.getElementById('form-cancel').onclick = () => { overlay.classList.remove('open'); sound.play('click'); resolve(null); };
        document.getElementById('form-save').onclick = () => {
            const n = nameI.value.trim(); let u = urlI.value.trim();
            if (!n) { showAlert(t('error'), t('enter_name')); return; }
            if (!u) { showAlert(t('error'), t('enter_url')); return; }
            if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
            data.name = n; data.url = u;
            overlay.classList.remove('open'); sound.play('notification');
            resolve(data);
        };
        overlay.classList.add('open');
    });
}

// ============================================================
//  START MENU
// ============================================================
function getAppsList() {
    return [
        { id: 'explorer', icon: '📂', label: t('explorer') },
        { id: 'calculator', icon: '🔢', label: t('calculator') },
        { id: 'notepad', icon: '📝', label: t('notepad') },
        { id: 'mediaplayer', icon: '🎵', label: t('mediaplayer') },
        { id: 'paint', icon: '🎨', label: t('paint') },
        { id: 'cmd', icon: '⌨️', label: t('cmd') },
        { id: 'controlpanel', icon: '⚙️', label: t('controlpanel') }
    ];
}
function renderStartMenu() {
    const list = document.getElementById('start-apps-list');
    const pinned = document.getElementById('start-pinned-list');
    const searchInput = document.getElementById('start-search');
    searchInput.placeholder = t('search_apps');
    const appsL = getAppsList();
    list.innerHTML = '';
    appsL.forEach(a => {
        const el = document.createElement('div');
        el.className = 'app-item';
        el.innerHTML = `<span class="icon">${a.icon}</span> ${a.label}`;
        el.onclick = () => { openApp(a.id); closeStartMenu(); };
        list.appendChild(el);
    });
    pinned.innerHTML = `<div class="pinned-title">${t('pinned')}</div>`;
    state.pinnedApps.forEach(id => {
        const app = appsL.find(a => a.id === id);
        if (!app) return;
        const el = document.createElement('div');
        el.className = 'pinned-item';
        el.innerHTML = `<span class="icon">${app.icon}</span> ${app.label}`;
        el.onclick = () => { openApp(app.id); closeStartMenu(); };
        pinned.appendChild(el);
    });
    searchInput.oninput = () => {
        const q = searchInput.value.toLowerCase().trim();
        list.querySelectorAll('.app-item').forEach(el => { el.style.display = el.textContent.toLowerCase().includes(q) ? 'flex' : 'none'; });
        pinned.querySelectorAll('.pinned-item').forEach(el => { el.style.display = el.textContent.toLowerCase().includes(q) ? 'flex' : 'none'; });
    };
}
function openStartMenu() {
    const m = document.getElementById('start-menu');
    if (m.classList.contains('open')) { closeStartMenu(); return; }
    renderStartMenu();
    m.classList.add('open');
}
function closeStartMenu() { document.getElementById('start-menu').classList.remove('open'); }
document.getElementById('start-btn').onclick = openStartMenu;
document.addEventListener('click', (e) => {
    const menu = document.getElementById('start-menu');
    const btn = document.getElementById('start-btn');
    if (menu.classList.contains('open') && !menu.contains(e.target) && !btn.contains(e.target)) closeStartMenu();
});

// ============================================================
//  DESKTOP
// ============================================================
function renderDesktopIcons() {
    const container = document.getElementById('desktop-icons');
    container.innerHTML = '';
    const appsL = getAppsList();

    appsL.forEach(a => {
        const el = document.createElement('div');
        el.className = 'desktop-icon';
        el.innerHTML = `<span class="icon">${a.icon}</span><span class="label">${a.label}</span>`;
        el.onclick = () => openApp(a.id);
        el.oncontextmenu = (e) => { e.preventDefault(); showDesktopMenu(e.clientX, e.clientY); };
        container.appendChild(el);
    });

    state.websiteShortcuts.forEach(sc => {
        const el = document.createElement('div');
        el.className = 'desktop-icon website-shortcut';
        el.innerHTML = `<div class="icon-box" style="background:${sc.color};">${sc.icon}</div><span class="label">${escapeHtml(sc.name)}</span>`;
        el.title = sc.url;
        el.onclick = () => { window.open(sc.url, '_blank'); sound.play('click'); };
        el.oncontextmenu = (e) => { e.preventDefault(); e.stopPropagation(); showShortcutMenu(e.clientX, e.clientY, sc); };
        container.appendChild(el);
    });

    const desktopNode = getFileSystemNode(['X:', 'Desktop']);
    if (desktopNode && desktopNode.children) {
        Object.entries(desktopNode.children).forEach(([name, item]) => {
            const isFolder = item.type === 'folder';
            const el = document.createElement('div');
            el.className = 'desktop-icon';
            el.innerHTML = `<span class="icon">${isFolder ? '📁' : getFileIcon(name)}</span><span class="label">${escapeHtml(name)}</span>`;
            el.ondblclick = () => {
                if (isFolder) { state.currentPath = ['X:', 'Desktop', name]; openApp('explorer'); }
                else openFileByPath(['X:', 'Desktop', name]);
            };
            el.oncontextmenu = (e) => { e.preventDefault(); showDesktopMenu(e.clientX, e.clientY); };
            container.appendChild(el);
        });
    }
}

function showShortcutMenu(x, y, sc) {
    const menu = document.getElementById('desktop-context');
    menu.style.display = 'block';
    menu.style.left = x + 'px'; menu.style.top = y + 'px';
    menu.innerHTML = `
        <div class="item" data-sc="open"><span class="icon">🌐</span> ${t('open_in_new_tab')}</div>
        <div class="item" data-sc="copy-url"><span class="icon">📋</span> ${t('copy_url')}</div>
        <div class="sep"></div>
        <div class="item" data-sc="edit"><span class="icon">✏️</span> ${t('edit')}</div>
        <div class="item" data-sc="duplicate"><span class="icon">📄</span> ${t('duplicate')}</div>
        <div class="sep"></div>
        <div class="item" data-sc="delete"><span class="icon">🗑️</span> ${t('delete')}</div>`;
    menu.querySelectorAll('[data-sc]').forEach(el => {
        el.onclick = () => {
            menu.style.display = 'none';
            const act = el.dataset.sc;
            if (act === 'open') { window.open(sc.url, '_blank'); sound.play('click'); }
            else if (act === 'copy-url') {
                navigator.clipboard.writeText(sc.url).then(() => showAlert('OK', sc.url)).catch(() => showAlert('OK', sc.url));
            } else if (act === 'edit') {
                openShortcutDialog(sc).then(r => {
                    if (r) {
                        const idx = state.websiteShortcuts.findIndex(s => s.id === sc.id);
                        if (idx >= 0) state.websiteShortcuts[idx] = r;
                        saveState(); renderDesktopIcons();
                    }
                });
            } else if (act === 'duplicate') {
                const c = { ...sc, id: 'sc_' + Date.now() + '_' + Math.random().toString(36).slice(2,6), name: sc.name + ' (copy)' };
                state.websiteShortcuts.push(c); saveState(); renderDesktopIcons();
            } else if (act === 'delete') {
                if (confirm(`${t('delete')} "${sc.name}"?`)) {
                    state.websiteShortcuts = state.websiteShortcuts.filter(s => s.id !== sc.id);
                    saveState(); renderDesktopIcons();
                }
            }
        };
    });
    setTimeout(() => document.addEventListener('click', function c() { menu.style.display = 'none'; document.removeEventListener('click', c); }, { once: true }), 10);
}

function showDesktopMenu(x, y) {
    const menu = document.getElementById('desktop-context');
    menu.style.display = 'block';
    menu.style.left = x + 'px'; menu.style.top = y + 'px';
    menu.innerHTML = `
        <div class="item" data-action="new-folder"><span class="icon">📁</span> ${t('new_folder')}</div>
        <div class="item" data-action="new-text"><span class="icon">📄</span> ${t('new_text')}</div>
        <div class="item" data-action="new-shortcut"><span class="icon">🌐</span> ${t('new_shortcut')}</div>
        <div class="sep"></div>
        <div class="item" data-action="refresh"><span class="icon">🔄</span> ${t('refresh')}</div>
        <div class="item" data-action="paste"><span class="icon">📋</span> ${t('paste')}</div>
        <div class="sep"></div>
        <div class="item" data-action="personalize"><span class="icon">⚙️</span> ${t('personalize')}</div>`;
    menu.querySelectorAll('[data-action]').forEach(el => {
        el.onclick = async () => {
            menu.style.display = 'none';
            const action = el.dataset.action;
            const node = getFileSystemNode(['X:', 'Desktop']);
            if (!node) return;
            if (!node.children) node.children = {};
            if (action === 'new-folder') {
                const name = prompt(t('new_folder') + ':');
                if (name && name.trim() && !node.children[name.trim()]) {
                    node.children[name.trim()] = { type: 'folder', label: name.trim(), children: {} };
                    saveState(); renderDesktopIcons();
                }
            } else if (action === 'new-text') {
                const name = prompt(t('new_text') + ':');
                if (name && name.trim()) {
                    const fn = name.includes('.') ? name.trim() : name.trim() + '.txt';
                    if (!node.children[fn]) {
                        node.children[fn] = { type: 'file', label: fn, content: '' };
                        saveState(); renderDesktopIcons();
                        openApp('notepad', { path: ['X:', 'Desktop', fn] });
                    }
                }
            } else if (action === 'new-shortcut') {
                const r = await openShortcutDialog(null);
                if (r) { state.websiteShortcuts.push(r); saveState(); renderDesktopIcons();
                    showAlert(t('done'), `"${r.name}" ${t('added_to_desktop')}`); }
            } else if (action === 'refresh') renderDesktopIcons();
            else if (action === 'paste' && state.clipboard) {
                const s = state.clipboard;
                if (!node.children[s.name]) {
                    node.children[s.name] = JSON.parse(JSON.stringify(s.data));
                    if (s.cut) { const p = getFileSystemNode(s.source); if (p && p.children) delete p.children[s.name]; }
                    state.clipboard = null;
                    saveState(); renderDesktopIcons();
                }
            } else if (action === 'personalize') openApp('controlpanel');
            sound.play('click');
        };
    });
    setTimeout(() => document.addEventListener('click', function c() { menu.style.display = 'none'; document.removeEventListener('click', c); }, { once: true }), 10);
}

document.getElementById('desktop').oncontextmenu = (e) => { e.preventDefault(); showDesktopMenu(e.clientX, e.clientY); };

// ============================================================
//  WALLPAPER
// ============================================================
const wallpapersMap = {
    default: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)',
    dark: 'linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 50%, #2d2d2d 100%)',
    gradient: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
    ocean: 'linear-gradient(135deg, #0c3483 0%, #a2b6df 100%)',
    forest: 'linear-gradient(135deg, #134e5e 0%, #71b280 100%)',
    space: 'linear-gradient(135deg, #0b0b2b 0%, #1a1a4e 50%, #2d1b69 100%)'
};
function applyWallpaper(style) {
    const d = document.getElementById('desktop');
    d.style.background = style;
    d.style.backgroundSize = 'cover';
    d.style.backgroundPosition = 'center';
}

// ============================================================
//  IMPORT HANDLER
// ============================================================
document.getElementById('import-file-input').addEventListener('change', function() {
    const f = this.files[0];
    if (f) handleImportFile(f);
    this.value = '';
});

// ============================================================
//  INIT
// ============================================================
renderDesktopIcons();
if (state.wallpaper === 'custom' && state.wallpaperUrl) applyWallpaper(`url("${state.wallpaperUrl}")`);
else applyWallpaper(wallpapersMap[state.wallpaper] || wallpapersMap.default);
document.getElementById('taskbar').className = state.taskbarPosition || 'bottom';

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        closeStartMenu();
        document.getElementById('desktop-context').style.display = 'none';
        document.getElementById('form-overlay').classList.remove('open');
    }
});

setTimeout(() => { showAlert(t('welcome_title'), t('welcome_msg')); }, 600);

window.MarfaOS = { state, apps, openApp, sound, saveState, resetState: () => { localStorage.removeItem(STORAGE_KEY); location.reload(); } };
console.log('🚀 MarfaOS 12 loaded! Language:', state.language);
</script>
